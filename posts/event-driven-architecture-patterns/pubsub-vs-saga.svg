<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440">
  <defs>
    <linearGradient id="bgEDA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a0d17"/>
    </linearGradient>
    <marker id="arrO2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f97316"/>
    </marker>
    <marker id="arrG2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arrP2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a855f7"/>
    </marker>
    <marker id="arrR2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e11d48"/>
    </marker>
  </defs>
  <rect width="860" height="440" fill="url(#bgEDA)" rx="12"/>
  <rect width="860" height="440" fill="none" stroke="#374151" stroke-width="1.5" rx="12"/>

  <text x="430" y="36" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#f1f5f9">CQRS Write/Read Split &amp; Orchestration-Based Saga</text>

  <!-- Divider -->
  <line x1="430" y1="55" x2="430" y2="420" stroke="#374151" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="215" y="68" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#f59e0b">CQRS</text>
  <text x="645" y="68" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#a855f7">Orchestration Saga</text>

  <!-- CQRS LEFT SIDE -->
  <!-- Command -->
  <rect x="30" y="90" width="100" height="32" rx="5" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="80" y="110" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#f59e0b">Command</text>
  <!-- Aggregate -->
  <rect x="155" y="90" width="100" height="32" rx="5" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="205" y="110" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#f59e0b">Aggregate</text>
  <!-- Event Store -->
  <rect x="90" y="155" width="130" height="32" rx="5" fill="#1e2533" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="155" y="175" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#f59e0b">Event Store</text>
  <!-- Projection -->
  <rect x="90" y="215" width="130" height="32" rx="5" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="155" y="235" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#3b82f6">Projection</text>
  <!-- Read Model -->
  <rect x="90" y="275" width="130" height="32" rx="5" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="2"/>
  <text x="155" y="295" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#3b82f6">Read Model</text>
  <!-- Query -->
  <rect x="90" y="335" width="130" height="32" rx="5" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="155" y="355" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#3b82f6">Query</text>

  <!-- CQRS arrows -->
  <line x1="130" y1="106" x2="153" y2="106" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrO2)"/>
  <line x1="205" y1="122" x2="185" y2="153" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrO2)"/>
  <text x="213" y="143" font-family="'Courier New', monospace" font-size="8" fill="#f59e0b">Event</text>
  <line x1="155" y1="187" x2="155" y2="213" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrG2)"/>
  <line x1="155" y1="247" x2="155" y2="273" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrG2)"/>
  <line x1="155" y1="307" x2="155" y2="333" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrG2)"/>
  <text x="168" y="199" font-family="'Courier New', monospace" font-size="8" fill="#3b82f6">builds</text>
  <text x="168" y="259" font-family="'Courier New', monospace" font-size="8" fill="#3b82f6">optimized</text>
  <text x="168" y="319" font-family="'Courier New', monospace" font-size="8" fill="#3b82f6">serves</text>

  <!-- Write/Read label -->
  <rect x="30" y="385" width="175" height="32" rx="5" fill="#1e2533" stroke="#374151" stroke-width="1"/>
  <text x="117" y="400" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#f59e0b">Write path: Command→Event Store</text>
  <text x="117" y="413" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#3b82f6">Read path: Projection→Query</text>

  <!-- SAGA RIGHT SIDE -->
  <!-- Orchestrator -->
  <rect x="560" y="90" width="130" height="36" rx="8" fill="#a855f7" fill-opacity="0.25" stroke="#a855f7" stroke-width="2"/>
  <text x="625" y="113" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#a855f7">Orchestrator</text>

  <!-- Step boxes -->
  <rect x="460" y="165" width="100" height="30" rx="5" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1.5"/>
  <text x="510" y="184" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">① Drain</text>

  <rect x="580" y="165" width="100" height="30" rx="5" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1.5"/>
  <text x="630" y="184" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">② Migrate</text>

  <rect x="700" y="165" width="110" height="30" rx="5" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1.5"/>
  <text x="755" y="184" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">③ Validate</text>

  <!-- Orchestrator to steps -->
  <line x1="595" y1="126" x2="520" y2="163" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrP2)"/>
  <line x1="625" y1="126" x2="625" y2="163" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrP2)"/>
  <line x1="660" y1="126" x2="740" y2="163" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrP2)"/>

  <!-- Step results back -->
  <line x1="510" y1="195" x2="560" y2="115" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrG2)" opacity="0.7"/>
  <line x1="630" y1="195" x2="625" y2="128" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrG2)" opacity="0.7"/>
  <line x1="755" y1="195" x2="695" y2="115" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrG2)" opacity="0.7"/>

  <!-- Failure path -->
  <rect x="460" y="255" width="100" height="30" rx="5" fill="#e11d48" fill-opacity="0.2" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="510" y="274" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#e11d48">② FAILS</text>

  <rect x="580" y="255" width="230" height="30" rx="5" fill="#e11d48" fill-opacity="0.15" stroke="#e11d48" stroke-width="1.5"/>
  <text x="695" y="274" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#e11d48">Compensate: undo ① Drain</text>

  <line x1="510" y1="195" x2="510" y2="253" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrR2)"/>
  <line x1="560" y1="270" x2="578" y2="270" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrR2)"/>
  <text x="540" y="248" font-family="'Courier New', monospace" font-size="9" fill="#e11d48">failure</text>

  <!-- Enable step -->
  <rect x="580" y="315" width="230" height="30" rx="5" fill="#22c55e" fill-opacity="0.3" stroke="#22c55e" stroke-width="2"/>
  <text x="695" y="334" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">④ Enable — COMMIT</text>
  <line x1="695" y1="253" x2="695" y2="313" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrP2)" opacity="0.7"/>

  <!-- Saga legend -->
  <rect x="450" y="365" width="390" height="50" rx="5" fill="#1e2533" stroke="#374151" stroke-width="1"/>
  <text x="645" y="383" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">Orchestrator drives each step · knows global state</text>
  <text x="645" y="397" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#22c55e">Success: events flow forward ✓</text>
  <text x="645" y="411" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#e11d48">Failure: compensating transactions undo completed steps</text>
</svg>
