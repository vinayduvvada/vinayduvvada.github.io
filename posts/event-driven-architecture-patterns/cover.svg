<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#1a0d17"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f97316"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="url(#bg)"/>
  <g stroke="#1e2533" stroke-width="1" opacity="0.25">
    <line x1="0" y1="96" x2="900" y2="96"/><line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="288" x2="900" y2="288"/><line x1="0" y1="384" x2="900" y2="384"/>
    <line x1="90" y1="0" x2="90" y2="480"/><line x1="180" y1="0" x2="180" y2="480"/>
    <line x1="270" y1="0" x2="270" y2="480"/><line x1="360" y1="0" x2="360" y2="480"/>
    <line x1="450" y1="0" x2="450" y2="480"/><line x1="540" y1="0" x2="540" y2="480"/>
    <line x1="630" y1="0" x2="630" y2="480"/><line x1="720" y1="0" x2="720" y2="480"/>
    <line x1="810" y1="0" x2="810" y2="480"/>
  </g>

  <!-- Title -->
  <text x="450" y="50" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#f1f5f9" filter="url(#glow)">Event-Driven Architecture</text>
  <text x="450" y="74" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#6b7280">Pub/Sub · Event Sourcing · CQRS · Sagas</text>

  <!-- Producer -->
  <rect x="50" y="160" width="120" height="50" rx="8" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="2"/>
  <text x="110" y="181" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#f97316">Producer</text>
  <text x="110" y="198" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#9ca3af">Service A</text>

  <!-- Event broker -->
  <rect x="330" y="140" width="240" height="90" rx="10" fill="#1e2533" stroke="#f97316" stroke-width="2"/>
  <text x="450" y="165" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#f97316">Event Broker</text>
  <rect x="345" y="173" width="60" height="20" rx="4" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="1"/>
  <text x="375" y="187" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#f97316">Topic A</text>
  <rect x="415" y="173" width="60" height="20" rx="4" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1"/>
  <text x="445" y="187" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#f97316">Topic B</text>
  <rect x="485" y="173" width="70" height="20" rx="4" fill="#f97316" fill-opacity="0.1" stroke="#f97316" stroke-width="1"/>
  <text x="520" y="187" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#f97316">Topic C</text>
  <text x="450" y="218" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">Kafka / Kinesis / SNS / Event Hub</text>

  <!-- Arrow producer → broker -->
  <line x1="170" y1="185" x2="328" y2="185" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrO)"/>
  <text x="250" y="177" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#f97316">events</text>

  <!-- Consumers -->
  <rect x="700" y="100" width="140" height="40" rx="8" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="770" y="125" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#3b82f6">Consumer 1</text>

  <rect x="700" y="165" width="140" height="40" rx="8" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1.5"/>
  <text x="770" y="190" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#22c55e">Consumer 2</text>

  <rect x="700" y="230" width="140" height="40" rx="8" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.5"/>
  <text x="770" y="255" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#a855f7">Consumer 3</text>

  <!-- Arrows broker → consumers -->
  <line x1="572" y1="160" x2="698" y2="122" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="572" y1="178" x2="698" y2="185" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="572" y1="195" x2="698" y2="250" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- Patterns row -->
  <rect x="50" y="310" width="180" height="70" rx="8" fill="#1e2533" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="332" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3b82f6">Pub / Sub</text>
  <text x="140" y="349" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">broadcast · fanout</text>
  <text x="140" y="365" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">SNS+SQS, Event Hub</text>

  <rect x="255" y="310" width="180" height="70" rx="8" fill="#1e2533" stroke="#22c55e" stroke-width="1.5"/>
  <text x="345" y="332" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#22c55e">Event Sourcing</text>
  <text x="345" y="349" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">store events, not state</text>
  <text x="345" y="365" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">full audit · time-travel</text>

  <rect x="460" y="310" width="180" height="70" rx="8" fill="#1e2533" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="550" y="332" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#f59e0b">CQRS</text>
  <text x="550" y="349" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">split write / read model</text>
  <text x="550" y="365" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">optimize each path</text>

  <rect x="665" y="310" width="185" height="70" rx="8" fill="#1e2533" stroke="#a855f7" stroke-width="1.5"/>
  <text x="757" y="332" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#a855f7">Saga Pattern</text>
  <text x="757" y="349" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">distributed transactions</text>
  <text x="757" y="365" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">compensating events</text>

  <!-- Bottom note -->
  <rect x="50" y="400" width="800" height="50" rx="8" fill="#1e2533" stroke="#374151" stroke-width="1" opacity="0.8"/>
  <text x="450" y="420" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#f59e0b">⚡ Idempotency is non-negotiable · Schema evolution matters · Dead-letter queues save you</text>
  <text x="450" y="438" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6b7280">Distributed tracing with correlation IDs is essential for observability</text>
</svg>
