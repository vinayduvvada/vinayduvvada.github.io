<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400">
  <defs>
    <linearGradient id="bgAO" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0d1a2a"/>
    </linearGradient>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a855f7"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e11d48"/>
    </marker>
    <marker id="arrY" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="url(#bgAO)" rx="12"/>
  <rect width="860" height="400" fill="none" stroke="#a855f7" stroke-width="1.5" rx="12" opacity="0.3"/>

  <text x="430" y="36" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#a855f7">Anchor-Then-Observe Pattern — Async Without a Receipt</text>

  <!-- Timeline bar -->
  <line x1="30" y1="80" x2="830" y2="80" stroke="#374151" stroke-width="2"/>
  <text x="430" y="72" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6b7280">time →</text>

  <!-- Step 1: Anchor -->
  <circle cx="90" cy="80" r="8" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="50" y="100" width="130" height="50" rx="6" fill="#1e2533" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="115" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#f59e0b">① Capture Anchor</text>
  <text x="115" y="136" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">last_commit = snapshot_A</text>
  <text x="115" y="148" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">record state before change</text>
  <line x1="115" y1="80" x2="115" y2="98" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Step 2: Submit -->
  <circle cx="240" cy="80" r="8" fill="#3b82f6" stroke="#3b82f6" stroke-width="2"/>
  <rect x="180" y="100" width="120" height="50" rx="6" fill="#1e2533" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="240" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#3b82f6">② Submit Change</text>
  <text x="240" y="136" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">API call fires</text>
  <text x="240" y="148" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">no receipt returned</text>
  <line x1="240" y1="80" x2="240" y2="98" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Step 3: Poll loop -->
  <circle cx="400" cy="80" r="8" fill="#a855f7" stroke="#a855f7" stroke-width="2"/>
  <rect x="330" y="100" width="145" height="100" rx="6" fill="#1e2533" stroke="#a855f7" stroke-width="1.5"/>
  <text x="402" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#a855f7">③ Poll Loop</text>
  <text x="402" y="137" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">get_latest_commit()</text>
  <text x="402" y="152" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">commit != snapshot_A?</text>
  <text x="402" y="166" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">my_change_in(config)?</text>
  <text x="402" y="180" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">retry_count &lt; max?</text>
  <text x="402" y="194" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">↻ loop every N seconds</text>
  <line x1="400" y1="80" x2="400" y2="98" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- loop back arrow -->
  <path d="M330 155 Q295 185 330 200 Q345 200 330 155" stroke="#a855f7" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrP)"/>

  <!-- Two-phase note -->
  <rect x="500" y="100" width="170" height="80" rx="6" fill="#1e2533" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="585" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#f59e0b">④ Two-Phase Watch</text>
  <text x="585" y="137" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">commit1 done but</text>
  <text x="585" y="151" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">change not reflected?</text>
  <text x="585" y="166" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#f59e0b">→ watch commit2</text>
  <text x="585" y="178" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">(propagation pipeline)</text>
  <circle cx="560" cy="80" r="8" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/>
  <line x1="560" y1="80" x2="560" y2="98" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="476" y1="148" x2="498" y2="148" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrY)" stroke-dasharray="3,2"/>

  <!-- SUCCESS -->
  <circle cx="730" cy="80" r="8" fill="#22c55e" stroke="#22c55e" stroke-width="2"/>
  <rect x="665" y="100" width="140" height="50" rx="6" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="2"/>
  <text x="735" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#22c55e">⑤ Verify by Content</text>
  <text x="735" y="136" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#22c55e">runtime config matches</text>
  <text x="735" y="148" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#22c55e">expected change → SUCCESS</text>
  <line x1="730" y1="80" x2="730" y2="98" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="671" y1="148" x2="663" y2="148" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrG)" stroke-dasharray="3,2" transform="scale(-1,1) translate(-1334,0)"/>

  <!-- FAILURE path -->
  <rect x="330" y="225" width="145" height="50" rx="6" fill="#e11d48" fill-opacity="0.15" stroke="#e11d48" stroke-width="1.5"/>
  <text x="402" y="245" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#e11d48">Max Retries Hit</text>
  <text x="402" y="260" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#e11d48">→ declare FAILURE</text>
  <text x="402" y="272" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">trigger rollback path</text>
  <line x1="402" y1="202" x2="402" y2="223" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrR)"/>

  <!-- Rollback -->
  <rect x="180" y="225" width="130" height="50" rx="6" fill="#e11d48" fill-opacity="0.15" stroke="#e11d48" stroke-width="1.5"/>
  <text x="245" y="245" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#e11d48">Rollback</text>
  <text x="245" y="261" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">restore snapshot_A</text>
  <text x="245" y="273" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">verify via same loop</text>
  <line x1="330" y1="250" x2="312" y2="250" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrR)"/>

  <!-- Legend -->
  <rect x="20" y="300" width="820" height="80" rx="8" fill="#1e2533" opacity="0.7"/>
  <text x="430" y="322" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#f59e0b">Key Insight</text>
  <text x="430" y="342" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#9ca3af">This is optimistic change tracking without a primary key — inferring which job is yours</text>
  <text x="430" y="358" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#9ca3af">based on timing (after anchor) and content (config matches expected change).</text>
  <text x="430" y="374" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6b7280">No job ID · No receipt · Pure observation of system state</text>
</svg>
