<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0d1a2a"/>
    </linearGradient>
    <linearGradient id="syncGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="asyncGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a855f7"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#1e2533" stroke-width="1" opacity="0.3">
    <line x1="0" y1="96" x2="900" y2="96"/><line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="288" x2="900" y2="288"/><line x1="0" y1="384" x2="900" y2="384"/>
    <line x1="90" y1="0" x2="90" y2="480"/><line x1="180" y1="0" x2="180" y2="480"/>
    <line x1="270" y1="0" x2="270" y2="480"/><line x1="360" y1="0" x2="360" y2="480"/>
    <line x1="450" y1="0" x2="450" y2="480"/><line x1="540" y1="0" x2="540" y2="480"/>
    <line x1="630" y1="0" x2="630" y2="480"/><line x1="720" y1="0" x2="720" y2="480"/>
    <line x1="810" y1="0" x2="810" y2="480"/>
  </g>

  <!-- Title -->
  <text x="450" y="52" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#f1f5f9" filter="url(#glow)">Async Operations in Enterprise Systems</text>
  <text x="450" y="76" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#6b7280">The Hidden Complexity of Background Work</text>

  <!-- Sync row -->
  <rect x="30" y="110" width="840" height="110" rx="10" fill="url(#syncGrad)" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>
  <text x="55" y="135" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#3b82f6">SYNCHRONOUS</text>

  <!-- Caller box -->
  <rect x="55" y="148" width="90" height="34" rx="6" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="170" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#3b82f6">Caller</text>
  <!-- arrow right -->
  <line x1="145" y1="165" x2="270" y2="165" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="207" y="158" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#3b82f6">request</text>
  <!-- Worker -->
  <rect x="272" y="148" width="110" height="34" rx="6" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="327" y="166" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#3b82f6">Worker</text>
  <text x="327" y="178" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">(processes)</text>
  <!-- arrow back -->
  <line x1="382" y1="165" x2="508" y2="165" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="445" y="158" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#3b82f6">response</text>
  <!-- Caller resumes -->
  <rect x="510" y="148" width="120" height="34" rx="6" fill="#3b82f6" fill-opacity="0.4" stroke="#3b82f6" stroke-width="2"/>
  <text x="570" y="170" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#fff">Caller continues</text>
  <!-- wait bar -->
  <rect x="145" y="190" width="365" height="10" rx="3" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="327" y="208" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">⏸ caller blocked until worker finishes</text>

  <!-- Async row -->
  <rect x="30" y="240" width="840" height="150" rx="10" fill="url(#asyncGrad)" stroke="#a855f7" stroke-width="1.5" opacity="0.8"/>
  <text x="55" y="265" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#a855f7">ASYNCHRONOUS</text>

  <!-- Caller fires -->
  <rect x="55" y="278" width="90" height="34" rx="6" fill="#a855f7" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.5"/>
  <text x="100" y="300" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#a855f7">Caller</text>
  <line x1="145" y1="295" x2="270" y2="295" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowP)" stroke-dasharray="6,2"/>
  <text x="207" y="288" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">submit</text>
  <!-- Worker queued -->
  <rect x="272" y="278" width="110" height="34" rx="6" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.5"/>
  <text x="327" y="296" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#a855f7">Queue</text>
  <text x="327" y="308" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">(accepted)</text>
  <!-- Caller continues immediately -->
  <rect x="510" y="278" width="120" height="34" rx="6" fill="#a855f7" fill-opacity="0.4" stroke="#a855f7" stroke-width="2"/>
  <text x="570" y="300" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#fff">Caller free ✓</text>
  <line x1="382" y1="295" x2="508" y2="295" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowP)" stroke-dasharray="3,2" opacity="0.5"/>
  <text x="445" y="288" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">ack only</text>
  <!-- Worker processes later -->
  <rect x="272" y="330" width="110" height="34" rx="6" fill="#a855f7" fill-opacity="0.3" stroke="#a855f7" stroke-width="1.5"/>
  <text x="327" y="348" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#a855f7">Worker</text>
  <text x="327" y="360" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">(later…)</text>
  <line x1="327" y1="312" x2="327" y2="328" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- notify back -->
  <line x1="382" y1="347" x2="508" y2="305" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowP)" stroke-dasharray="4,3" opacity="0.7"/>
  <text x="455" y="333" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">notify/poll</text>

  <!-- Key message -->
  <rect x="30" y="408" width="840" height="50" rx="8" fill="#1e2533" stroke="#374151" stroke-width="1"/>
  <text x="450" y="427" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#f59e0b">⚡ The gap between submit and done is where complexity lives</text>
  <text x="450" y="448" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6b7280">Failure is silent by default · State becomes intermediate · Testing requires simulated delays</text>
</svg>
