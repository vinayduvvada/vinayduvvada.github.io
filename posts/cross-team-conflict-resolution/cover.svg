<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#17101f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a855f7"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrOk" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="url(#bg)"/>
  <g stroke="#1e2533" stroke-width="1" opacity="0.25">
    <line x1="0" y1="96" x2="900" y2="96"/><line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="288" x2="900" y2="288"/><line x1="0" y1="384" x2="900" y2="384"/>
    <line x1="90" y1="0" x2="90" y2="480"/><line x1="270" y1="0" x2="270" y2="480"/>
    <line x1="450" y1="0" x2="450" y2="480"/><line x1="630" y1="0" x2="630" y2="480"/>
    <line x1="810" y1="0" x2="810" y2="480"/>
  </g>

  <text x="450" y="50" text-anchor="middle" font-family="'Courier New', monospace" font-size="21" font-weight="bold" fill="#f1f5f9" filter="url(#glow)">Cross-Team Conflict Resolution</text>
  <text x="450" y="74" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#6b7280">A sequencing disagreement during a cross-region migration</text>

  <!-- Source Region -->
  <rect x="40" y="130" width="300" height="190" rx="12" fill="#1e2533" stroke="#a855f7" stroke-width="1.5"/>
  <text x="190" y="155" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#a855f7">Source Region</text>
  <rect x="70" y="175" width="110" height="40" rx="6" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.5"/>
  <text x="125" y="192" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#a855f7">App + DB</text>
  <text x="125" y="206" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#6b7280">primary LB</text>
  <rect x="200" y="175" width="110" height="40" rx="6" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.5"/>
  <text x="255" y="192" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#a855f7">Gateway LB</text>
  <text x="255" y="206" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#6b7280">source endpoints</text>
  <text x="190" y="245" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">Instance B lives here</text>
  <text x="190" y="262" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">config carries source gateway list</text>

  <!-- Target Region -->
  <rect x="560" y="130" width="300" height="190" rx="12" fill="#1e2533" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="710" y="155" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#06b6d4">Target Region</text>
  <rect x="590" y="175" width="110" height="40" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="645" y="192" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#06b6d4">App + DB</text>
  <text x="645" y="206" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#6b7280">primary LB</text>
  <rect x="720" y="175" width="110" height="40" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="775" y="192" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#06b6d4">Gateway LB</text>
  <text x="775" y="206" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#6b7280">target endpoints</text>
  <text x="710" y="245" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">destination for the move</text>
  <text x="710" y="262" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">needs its own gateway list</text>

  <!-- Move arrow -->
  <line x1="340" y1="225" x2="552" y2="225" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="446" y="215" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#f59e0b" filter="url(#glow)">cross-region move</text>
  <text x="446" y="243" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#6b7280">when do we update the gateway config?</text>

  <!-- Conflict / Resolution -->
  <rect x="40" y="345" width="410" height="110" rx="10" fill="#1e2533" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="245" y="368" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#e11d48">The Conflict</text>
  <text x="245" y="388" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">Provision before copy → overwritten by copy</text>
  <text x="245" y="404" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">Provision after cutover → stale source endpoints</text>
  <text x="245" y="420" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">Copy-only → traffic loops back across regions</text>
  <text x="245" y="440" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">both teams optimizing for different risks</text>

  <rect x="490" y="345" width="370" height="110" rx="10" fill="#1e2533" stroke="#22c55e" stroke-width="1.5"/>
  <text x="675" y="368" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#22c55e">The Resolution</text>
  <text x="675" y="388" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">add-node → config copy →</text>
  <text x="675" y="404" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">provision gateway at target → cutover</text>
  <text x="675" y="424" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">overwrite semantics become the fix,</text>
  <text x="675" y="440" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">not the bug — verify before you argue</text>

  <line x1="450" y1="400" x2="488" y2="400" stroke="#22c55e" stroke-width="2" marker-end="url(#arrOk)"/>
</svg>
