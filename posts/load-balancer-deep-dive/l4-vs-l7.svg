<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400">
  <defs>
    <linearGradient id="bgLB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0d1a16"/>
    </linearGradient>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrGn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="url(#bgLB)" rx="12"/>
  <rect width="860" height="400" fill="none" stroke="#374151" stroke-width="1.5" rx="12"/>

  <text x="430" y="34" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#f1f5f9">L4 vs L7 Load Balancing — Request Flow</text>

  <!-- Divider -->
  <line x1="430" y1="50" x2="430" y2="385" stroke="#374151" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="215" y="62" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#06b6d4">L4 — Transport Layer</text>
  <text x="645" y="62" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#22c55e">L7 — Application Layer</text>

  <!-- L4 flow -->
  <rect x="20" y="80" width="80" height="30" rx="5" fill="#374151" stroke="#6b7280" stroke-width="1"/>
  <text x="60" y="99" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#9ca3af">Client</text>

  <rect x="155" y="80" width="120" height="30" rx="5" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="215" y="99" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#06b6d4">L4 Load Balancer</text>

  <line x1="100" y1="95" x2="153" y2="95" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrCyan)"/>
  <text x="127" y="88" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#06b6d4">TCP stream</text>

  <rect x="330" y="65" width="90" height="25" rx="4" fill="#1e2533" stroke="#374151" stroke-width="1"/>
  <text x="375" y="81" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">Backend A</text>
  <rect x="330" y="96" width="90" height="25" rx="4" fill="#1e2533" stroke="#374151" stroke-width="1"/>
  <text x="375" y="112" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">Backend B</text>
  <rect x="330" y="127" width="90" height="25" rx="4" fill="#1e2533" stroke="#374151" stroke-width="1"/>
  <text x="375" y="143" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">Backend C</text>

  <line x1="275" y1="88" x2="328" y2="78" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrCyan)"/>
  <line x1="275" y1="95" x2="328" y2="108" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrCyan)"/>
  <line x1="275" y1="100" x2="328" y2="139" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrCyan)"/>

  <!-- L4 characteristics -->
  <rect x="20" y="168" width="400" height="120" rx="8" fill="#1e2533" stroke="#06b6d4" stroke-width="1" opacity="0.8"/>
  <text x="220" y="188" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#06b6d4">L4 Characteristics</text>
  <text x="40" y="207" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">✓ Fastest — no packet inspection</text>
  <text x="40" y="222" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">✓ Protocol agnostic (TCP/UDP)</text>
  <text x="40" y="237" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">✓ Lower latency, higher throughput</text>
  <text x="40" y="252" font-family="'Courier New', monospace" font-size="10" fill="#e11d48">✗ Cannot inspect HTTP headers/path</text>
  <text x="40" y="267" font-family="'Courier New', monospace" font-size="10" fill="#e11d48">✗ No SSL termination or content rules</text>
  <text x="40" y="282" font-family="'Courier New', monospace" font-size="10" fill="#9ca3af">→ Use for: DB, gaming, raw TCP svc</text>

  <!-- L7 flow -->
  <rect x="440" y="80" width="80" height="30" rx="5" fill="#374151" stroke="#6b7280" stroke-width="1"/>
  <text x="480" y="99" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#9ca3af">Client</text>

  <rect x="565" y="72" width="130" height="46" rx="5" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5"/>
  <text x="630" y="92" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">L7 Load Balancer</text>
  <text x="630" y="107" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">reads HTTP, SSL term</text>

  <line x1="520" y1="95" x2="563" y2="95" stroke="#22c55e" stroke-width="2" marker-end="url(#arrGn)"/>
  <text x="542" y="88" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#22c55e">HTTPS</text>

  <!-- Routing rules -->
  <rect x="710" y="60" width="130" height="25" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="775" y="76" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#22c55e">/api/* → API servers</text>
  <rect x="710" y="91" width="130" height="25" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="775" y="107" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#22c55e">/static/* → CDN</text>
  <rect x="710" y="122" width="130" height="25" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="775" y="138" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#f59e0b">X-Premium → tier2</text>

  <line x1="695" y1="95" x2="708" y2="72" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrGn)"/>
  <line x1="695" y1="95" x2="708" y2="103" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrGn)"/>
  <line x1="695" y1="95" x2="708" y2="134" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrGn)"/>

  <!-- L7 characteristics -->
  <rect x="440" y="168" width="400" height="140" rx="8" fill="#1e2533" stroke="#22c55e" stroke-width="1" opacity="0.8"/>
  <text x="640" y="188" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#22c55e">L7 Characteristics</text>
  <text x="460" y="207" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">✓ Path/header/cookie-based routing</text>
  <text x="460" y="222" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">✓ SSL termination (centralized certs)</text>
  <text x="460" y="237" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">✓ Sticky sessions (cookie affinity)</text>
  <text x="460" y="252" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">✓ HTTP health checks (/health 200)</text>
  <text x="460" y="267" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">✓ gRPC-aware, request rewriting</text>
  <text x="460" y="282" font-family="'Courier New', monospace" font-size="10" fill="#e11d48">✗ Higher latency (full HTTP parse)</text>
  <text x="460" y="297" font-family="'Courier New', monospace" font-size="10" fill="#9ca3af">→ Use for: HTTP/HTTPS microservices</text>

  <!-- Bottom note -->
  <rect x="20" y="318" width="820" height="62" rx="8" fill="#1e2533" stroke="#374151" stroke-width="1" opacity="0.8"/>
  <text x="430" y="338" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#f59e0b">SSL Termination Modes</text>
  <text x="215" y="358" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#9ca3af">Terminate at LB: Client→LB (HTTPS), LB→Backend (HTTP)</text>
  <text x="215" y="373" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6b7280">Centralized certs · L7 routing possible</text>
  <text x="645" y="358" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#9ca3af">Passthrough: LB forwards encrypted stream unchanged</text>
  <text x="645" y="373" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6b7280">End-to-end encryption · No L7 routing</text>
  <line x1="430" y1="330" x2="430" y2="375" stroke="#374151" stroke-width="1"/>
</svg>
