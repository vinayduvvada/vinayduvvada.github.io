<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0d1a16"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06b6d4"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="900" height="480" fill="url(#bg)"/>
  <g stroke="#1e2533" stroke-width="1" opacity="0.25">
    <line x1="0" y1="96" x2="900" y2="96"/><line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="288" x2="900" y2="288"/><line x1="0" y1="384" x2="900" y2="384"/>
    <line x1="90" y1="0" x2="90" y2="480"/><line x1="270" y1="0" x2="270" y2="480"/>
    <line x1="450" y1="0" x2="450" y2="480"/><line x1="630" y1="0" x2="630" y2="480"/>
    <line x1="810" y1="0" x2="810" y2="480"/>
  </g>

  <text x="450" y="50" text-anchor="middle" font-family="'Courier New', monospace" font-size="21" font-weight="bold" fill="#f1f5f9" filter="url(#glow)">Load Balancers Deep Dive</text>
  <text x="450" y="74" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#6b7280">L4 vs L7 · Algorithms · Health Checks · ADC Migration</text>

  <!-- Clients -->
  <rect x="30" y="150" width="70" height="30" rx="5" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
  <text x="65" y="169" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#9ca3af">Client 1</text>
  <rect x="30" y="195" width="70" height="30" rx="5" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
  <text x="65" y="214" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#9ca3af">Client 2</text>
  <rect x="30" y="240" width="70" height="30" rx="5" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
  <text x="65" y="259" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#9ca3af">Client 3</text>

  <!-- Arrows to LB -->
  <line x1="100" y1="165" x2="195" y2="200" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrC)"/>
  <line x1="100" y1="210" x2="195" y2="210" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrC)"/>
  <line x1="100" y1="255" x2="195" y2="220" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrC)"/>

  <!-- Load Balancer -->
  <rect x="197" y="160" width="160" height="100" rx="10" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="277" y="198" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#06b6d4" filter="url(#glow)">Load</text>
  <text x="277" y="215" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#06b6d4" filter="url(#glow)">Balancer</text>
  <text x="277" y="232" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">VIP: 10.0.0.1</text>
  <text x="277" y="246" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">L4 / L7</text>

  <!-- Arrows to backends -->
  <line x1="357" y1="190" x2="480" y2="150" stroke="#22c55e" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="357" y1="210" x2="480" y2="210" stroke="#22c55e" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="357" y1="230" x2="480" y2="270" stroke="#22c55e" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- Backends -->
  <rect x="482" y="125" width="110" height="50" rx="8" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5"/>
  <text x="537" y="147" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#22c55e">Backend 1</text>
  <text x="537" y="163" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">healthy ✓</text>

  <rect x="482" y="185" width="110" height="50" rx="8" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1.5"/>
  <text x="537" y="207" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#22c55e">Backend 2</text>
  <text x="537" y="223" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">healthy ✓</text>

  <rect x="482" y="245" width="110" height="50" rx="8" fill="#e11d48" fill-opacity="0.15" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="537" y="267" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#e11d48">Backend 3</text>
  <text x="537" y="283" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#e11d48">unhealthy ✗</text>

  <!-- Health check pulse -->
  <circle cx="470" cy="270" r="6" fill="#e11d48" fill-opacity="0.4" stroke="#e11d48" stroke-width="1.5"/>
  <circle cx="470" cy="270" r="12" fill="none" stroke="#e11d48" stroke-width="1" opacity="0.4"/>

  <!-- L4 vs L7 boxes -->
  <rect x="630" y="130" width="240" height="80" rx="8" fill="#1e2533" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="750" y="152" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#06b6d4">L4 — Transport Layer</text>
  <text x="750" y="168" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">Routes by IP + Port</text>
  <text x="750" y="182" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">No content inspection · Ultra fast</text>
  <text x="750" y="196" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">DB, gaming, raw TCP</text>

  <rect x="630" y="225" width="240" height="90" rx="8" fill="#1e2533" stroke="#22c55e" stroke-width="1.5"/>
  <text x="750" y="247" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#22c55e">L7 — Application Layer</text>
  <text x="750" y="263" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">Routes by URL path, headers, cookies</text>
  <text x="750" y="277" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">SSL termination · Content rewriting</text>
  <text x="750" y="291" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">HTTP/HTTPS, microservices, API GW</text>
  <text x="750" y="305" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">/api/* → API · /static/* → CDN</text>

  <!-- Algorithms -->
  <rect x="30" y="335" width="840" height="120" rx="10" fill="#1e2533" stroke="#374151" stroke-width="1.5"/>
  <text x="450" y="358" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#f1f5f9">Load Balancing Algorithms</text>

  <rect x="50" y="370" width="140" height="34" rx="5" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
  <text x="120" y="387" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#06b6d4">Round Robin</text>
  <text x="120" y="399" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#6b7280">1→2→3→1→2…</text>

  <rect x="205" y="370" width="155" height="34" rx="5" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="282" y="387" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#22c55e">Least Connections</text>
  <text x="282" y="399" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#6b7280">route to least busy</text>

  <rect x="375" y="370" width="155" height="34" rx="5" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="452" y="387" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#f59e0b">IP Hash / Sticky</text>
  <text x="452" y="399" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#6b7280">same client → same backend</text>

  <rect x="545" y="370" width="155" height="34" rx="5" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
  <text x="622" y="387" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">Power of Two Choices</text>
  <text x="622" y="399" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#6b7280">pick 2 random, take best</text>

  <rect x="715" y="370" width="135" height="34" rx="5" fill="#e11d48" fill-opacity="0.15" stroke="#e11d48" stroke-width="1"/>
  <text x="782" y="387" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#e11d48">Consistent Hashing</text>
  <text x="782" y="399" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#6b7280">cache affinity, ring</text>

  <text x="450" y="436" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6b7280">Least Connections or Power of Two &gt; Round Robin for variable-duration requests</text>
</svg>
