<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="optimisticGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="pessimisticGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e11d48;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#be123c;stop-opacity:0.05" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <g stroke="#1e2533" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="480"/>
    <line x1="180" y1="0" x2="180" y2="480"/>
    <line x1="280" y1="0" x2="280" y2="480"/>
    <line x1="380" y1="0" x2="380" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="580" y1="0" x2="580" y2="480"/>
    <line x1="680" y1="0" x2="680" y2="480"/>
    <line x1="780" y1="0" x2="780" y2="480"/>
    <line x1="880" y1="0" x2="880" y2="480"/>
  </g>

  <!-- Left panel: Optimistic -->
  <rect x="30" y="100" width="380" height="300" rx="12" fill="url(#optimisticGrad)" stroke="#22c55e" stroke-width="1.5" opacity="0.8"/>
  <text x="220" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="bold" fill="#22c55e" filter="url(#glow)">OPTIMISTIC LOCKING</text>

  <!-- Optimistic: Timeline arrows -->
  <!-- T1 read -->
  <rect x="60" y="165" width="80" height="28" rx="5" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1"/>
  <text x="100" y="184" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#22c55e">T1: READ</text>
  <!-- T2 read -->
  <rect x="60" y="205" width="80" height="28" rx="5" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1"/>
  <text x="100" y="224" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#22c55e">T2: READ</text>

  <!-- Version badge -->
  <rect x="200" y="175" width="80" height="20" rx="10" fill="#22c55e" fill-opacity="0.3" stroke="#22c55e" stroke-width="1"/>
  <text x="240" y="189" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">v=1</text>

  <!-- Arrow from reads to version -->
  <line x1="140" y1="179" x2="198" y2="185" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,2" opacity="0.7"/>
  <line x1="140" y1="219" x2="198" y2="185" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,2" opacity="0.7"/>

  <!-- T1 write/commit -->
  <rect x="60" y="255" width="80" height="28" rx="5" fill="#22c55e" fill-opacity="0.35" stroke="#22c55e" stroke-width="1.5"/>
  <text x="100" y="274" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#22c55e">T1: WRITE</text>
  <!-- Version bump -->
  <rect x="200" y="255" width="80" height="20" rx="10" fill="#22c55e" fill-opacity="0.5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="240" y="269" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">v=1→2 ✓</text>
  <line x1="140" y1="269" x2="198" y2="265" stroke="#22c55e" stroke-width="1.5" opacity="0.9"/>
  <polygon points="198,262 198,268 204,265" fill="#22c55e"/>

  <!-- T2 conflict -->
  <rect x="60" y="305" width="80" height="28" rx="5" fill="#e11d48" fill-opacity="0.2" stroke="#e11d48" stroke-width="1"/>
  <text x="100" y="324" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#e11d48">T2: RETRY</text>
  <rect x="200" y="305" width="80" height="20" rx="10" fill="#e11d48" fill-opacity="0.3" stroke="#e11d48" stroke-width="1"/>
  <text x="240" y="319" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#e11d48">v≠1 conflict</text>
  <line x1="140" y1="319" x2="198" y2="315" stroke="#e11d48" stroke-width="1" stroke-dasharray="3,2" opacity="0.8"/>

  <text x="220" y="365" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6b7280">No locks held. Check at commit time.</text>
  <text x="220" y="385" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6b7280">High throughput. Retry on conflict.</text>

  <!-- Right panel: Pessimistic -->
  <rect x="490" y="100" width="380" height="300" rx="12" fill="url(#pessimisticGrad)" stroke="#e11d48" stroke-width="1.5" opacity="0.8"/>
  <text x="680" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="bold" fill="#e11d48" filter="url(#glow)">PESSIMISTIC LOCKING</text>

  <!-- Lock icon -->
  <rect x="660" y="160" width="40" height="30" rx="4" fill="#e11d48" fill-opacity="0.3" stroke="#e11d48" stroke-width="1.5"/>
  <path d="M670 160 Q680 148 690 160" stroke="#e11d48" stroke-width="2" fill="none"/>
  <circle cx="680" cy="175" r="4" fill="#e11d48"/>
  <line x1="680" y1="179" x2="680" y2="184" stroke="#e11d48" stroke-width="2"/>

  <!-- T1 acquires lock -->
  <rect x="520" y="200" width="100" height="28" rx="5" fill="#e11d48" fill-opacity="0.25" stroke="#e11d48" stroke-width="1.5"/>
  <text x="570" y="219" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#e11d48">T1: LOCK ✓</text>

  <!-- T2 blocked -->
  <rect x="520" y="245" width="100" height="28" rx="5" fill="#374151" fill-opacity="0.6" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="570" y="264" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#9ca3af">T2: WAIT…</text>

  <!-- T3 blocked -->
  <rect x="520" y="285" width="100" height="28" rx="5" fill="#374151" fill-opacity="0.6" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="570" y="304" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#9ca3af">T3: WAIT…</text>

  <!-- Queue line -->
  <line x1="620" y1="214" x2="650" y2="214" stroke="#e11d48" stroke-width="2" opacity="0.7"/>
  <line x1="620" y1="259" x2="650" y2="259" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.5"/>
  <line x1="620" y1="299" x2="650" y2="299" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- Shared resource box -->
  <rect x="660" y="200" width="170" height="120" rx="8" fill="#1e2533" stroke="#374151" stroke-width="1.5"/>
  <text x="745" y="220" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#9ca3af">RESOURCE</text>
  <rect x="680" y="228" width="130" height="22" rx="4" fill="#e11d48" fill-opacity="0.2" stroke="#e11d48" stroke-width="1"/>
  <text x="745" y="243" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#e11d48">🔒 T1 holds lock</text>
  <rect x="680" y="258" width="130" height="22" rx="4" fill="#374151" stroke="#6b7280" stroke-width="1"/>
  <text x="745" y="273" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6b7280">T2 queued</text>
  <rect x="680" y="288" width="130" height="22" rx="4" fill="#374151" stroke="#6b7280" stroke-width="1"/>
  <text x="745" y="303" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6b7280">T3 queued</text>

  <text x="680" y="365" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6b7280">Lock acquired before access.</text>
  <text x="680" y="385" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6b7280">Serialized. No conflicts possible.</text>

  <!-- Center divider VS -->
  <circle cx="450" cy="250" r="26" fill="#1e2533" stroke="#374151" stroke-width="2"/>
  <text x="450" y="256" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#f59e0b">VS</text>

  <!-- Title -->
  <text x="450" y="55" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#f1f5f9" filter="url(#glow)">Database Concurrency Control</text>
  <text x="450" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#6b7280">Optimistic vs. Pessimistic Locking</text>
</svg>
