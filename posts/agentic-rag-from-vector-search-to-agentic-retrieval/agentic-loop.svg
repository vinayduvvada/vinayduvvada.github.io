<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="Agentic retrieval loop: Plan, Retrieve, Reflect and Verify, Synthesize, with a loop back to Retrieve and a grounding and permissions side box">
  <rect width="1000" height="520" fill="#0a0a0a"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#e50914"/></marker></defs>
  <text x="50" y="60" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#e5e5e5">Agentic retrieval loop</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="50" y="110" width="190" height="100" rx="12" fill="#141414" stroke="#e50914" stroke-width="2"/>
    <text x="145" y="152" font-size="24" font-weight="700" fill="#e5e5e5">1. Plan</text>
    <text x="145" y="182" font-size="16" fill="#8c8c8c">Break down the question</text>
    <rect x="290" y="110" width="190" height="100" rx="12" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
    <text x="385" y="152" font-size="24" font-weight="700" fill="#e5e5e5">2. Retrieve</text>
    <text x="385" y="182" font-size="16" fill="#8c8c8c">Search, then search again</text>
    <rect x="530" y="110" width="190" height="100" rx="12" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
    <text x="625" y="152" font-size="24" font-weight="700" fill="#e5e5e5">3. Reflect / Verify</text>
    <text x="625" y="182" font-size="16" fill="#8c8c8c">Enough? Consistent?</text>
    <rect x="770" y="110" width="180" height="100" rx="12" fill="#e50914"/>
    <text x="860" y="152" font-size="24" font-weight="700" fill="#ffffff">4. Synthesize</text>
    <text x="860" y="182" font-size="16" fill="#ffffff">Answer with citations</text>
  </g>
  <g stroke="#e50914" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="240" y1="160" x2="288" y2="160"/>
    <line x1="480" y1="160" x2="528" y2="160"/>
    <line x1="720" y1="160" x2="768" y2="160"/>
  </g>
  <!-- Loop back from Reflect to Retrieve -->
  <path d="M 625 210 L 625 300 L 385 300 L 385 212" stroke="#e50914" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="505" y="330" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e50914" text-anchor="middle">Not enough evidence? Loop back to Retrieve</text>
  <!-- Side box -->
  <rect x="50" y="370" width="900" height="100" rx="12" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
  <text x="80" y="415" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e5e5e5">Grounding / permissions</text>
  <text x="80" y="448" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#8c8c8c">Only passages the user may see reach the model — checked at every Reflect step.</text>
</svg>
