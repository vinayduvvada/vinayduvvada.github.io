<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Agentic RAG — From vector search to agentic retrieval">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <circle cx="1050" cy="90" r="220" fill="#e50914" opacity="0.12"/>
  <rect x="60" y="60" width="72" height="10" rx="5" fill="#e50914"/>
  <text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800" fill="#e5e5e5">Agentic RAG</text>
  <text x="60" y="215" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#8c8c8c">From vector search to agentic retrieval</text>
  <text x="60" y="260" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#8c8c8c">Plan — Retrieve — Reflect — Synthesize</text>
  <!-- Flow -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="60" y="330" width="170" height="90" rx="12" fill="#141414" stroke="#e50914" stroke-width="2"/>
    <text x="145" y="383" fill="#e5e5e5">Query</text>
    <rect x="290" y="330" width="170" height="90" rx="12" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
    <text x="375" y="383" fill="#e5e5e5">Plan</text>
    <rect x="520" y="330" width="170" height="90" rx="12" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
    <text x="605" y="383" fill="#e5e5e5">Retrieve</text>
    <rect x="750" y="330" width="170" height="90" rx="12" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
    <text x="835" y="383" fill="#e5e5e5">Verify</text>
    <rect x="980" y="330" width="160" height="90" rx="12" fill="#e50914"/>
    <text x="1060" y="383" fill="#ffffff">Answer</text>
  </g>
  <g stroke="#e50914" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#e50914"/></marker></defs>
    <line x1="230" y1="375" x2="288" y2="375"/>
    <line x1="460" y1="375" x2="518" y2="375"/>
    <line x1="690" y1="375" x2="748" y2="375"/>
    <line x1="920" y1="375" x2="978" y2="375"/>
  </g>
  <text x="60" y="500" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#8c8c8c">vinayduvvada.github.io</text>
  <text x="60" y="540" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#8c8c8c">November 23, 2026</text>
</svg>
