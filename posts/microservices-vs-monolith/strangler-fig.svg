<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360">
  <defs>
    <linearGradient id="bgSF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#100d1a"/>
    </linearGradient>
    <marker id="arrPurp" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a855f7"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
  </defs>
  <rect width="860" height="360" fill="url(#bgSF)" rx="12"/>
  <rect width="860" height="360" fill="none" stroke="#a855f7" stroke-width="1.5" rx="12" opacity="0.3"/>

  <text x="430" y="34" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#a855f7">Strangler Fig Migration: Monolith → Microservices</text>

  <!-- Phase labels -->
  <text x="100" y="64" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#6b7280">Phase 1</text>
  <text x="310" y="64" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#6b7280">Phase 2</text>
  <text x="530" y="64" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#6b7280">Phase 3</text>
  <text x="745" y="64" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#6b7280">Phase 4</text>

  <!-- Phase arrows -->
  <line x1="155" y1="56" x2="215" y2="56" stroke="#374151" stroke-width="1.5" marker-end="url(#arrPurp)"/>
  <line x1="365" y1="56" x2="425" y2="56" stroke="#374151" stroke-width="1.5" marker-end="url(#arrPurp)"/>
  <line x1="585" y1="56" x2="650" y2="56" stroke="#374151" stroke-width="1.5" marker-end="url(#arrPurp)"/>

  <!-- Phase 1: Pure monolith -->
  <rect x="30" y="80" width="140" height="200" rx="8" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="105" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#3b82f6">Monolith</text>
  <rect x="50" y="115" width="100" height="25" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="100" y="131" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#3b82f6">Module A</text>
  <rect x="50" y="148" width="100" height="25" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="100" y="164" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#3b82f6">Module B</text>
  <rect x="50" y="181" width="100" height="25" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="100" y="197" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#3b82f6">Module C</text>
  <rect x="50" y="214" width="100" height="25" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="100" y="230" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#3b82f6">Module D</text>
  <rect x="30" y="295" width="140" height="20" rx="4" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1"/>
  <text x="100" y="309" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#3b82f6">Single DB</text>

  <!-- Phase 2: Peel off first service -->
  <rect x="230" y="80" width="140" height="200" rx="8" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="300" y="105" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#3b82f6">Monolith</text>
  <rect x="250" y="115" width="100" height="25" rx="4" fill="#374151" fill-opacity="0.5" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="300" y="131" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">Module A →</text>
  <rect x="250" y="148" width="100" height="25" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="300" y="164" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#3b82f6">Module B</text>
  <rect x="250" y="181" width="100" height="25" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="300" y="197" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#3b82f6">Module C</text>
  <rect x="250" y="214" width="100" height="25" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="300" y="230" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#3b82f6">Module D</text>

  <!-- New Service A -->
  <rect x="350" y="110" width="105" height="50" rx="6" fill="#a855f7" fill-opacity="0.25" stroke="#a855f7" stroke-width="2"/>
  <text x="402" y="130" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#a855f7">Service A</text>
  <text x="402" y="148" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">own DB ✓</text>
  <line x1="350" y1="128" x2="352" y2="128" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>
  <!-- API GW -->
  <rect x="230" y="295" width="225" height="20" rx="4" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1"/>
  <text x="342" y="309" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#22c55e">API Gateway routes traffic</text>

  <!-- Phase 3: More peeled -->
  <rect x="450" y="80" width="140" height="200" rx="8" fill="#3b82f6" fill-opacity="0.05" stroke="#3b82f6" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="520" y="105" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#3b82f6">Monolith</text>
  <rect x="470" y="115" width="100" height="25" rx="4" fill="#374151" opacity="0.3" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="520" y="131" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">gone</text>
  <rect x="470" y="148" width="100" height="25" rx="4" fill="#374151" opacity="0.3" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="520" y="164" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6b7280">gone</text>
  <rect x="470" y="181" width="100" height="25" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="520" y="197" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#3b82f6">Module C</text>
  <rect x="470" y="214" width="100" height="25" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="520" y="230" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#3b82f6">Module D</text>
  <!-- Services A,B -->
  <rect x="570" y="105" width="90" height="32" rx="5" fill="#a855f7" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.5"/>
  <text x="615" y="125" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">Service A+B</text>
  <rect x="450" y="295" width="220" height="20" rx="4" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1"/>
  <text x="560" y="309" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#22c55e">API Gateway</text>

  <!-- Phase 4: Full microservices -->
  <rect x="660" y="80" width="170" height="200" rx="8" fill="#a855f7" fill-opacity="0.08" stroke="#a855f7" stroke-width="2"/>
  <text x="745" y="105" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#a855f7">Microservices</text>
  <rect x="672" y="115" width="72" height="25" rx="4" fill="#a855f7" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.5"/>
  <text x="708" y="131" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">Svc A</text>
  <rect x="752" y="115" width="68" height="25" rx="4" fill="#a855f7" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.5"/>
  <text x="786" y="131" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">Svc B</text>
  <rect x="672" y="150" width="72" height="25" rx="4" fill="#a855f7" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.5"/>
  <text x="708" y="166" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">Svc C</text>
  <rect x="752" y="150" width="68" height="25" rx="4" fill="#a855f7" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.5"/>
  <text x="786" y="166" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">Svc D</text>
  <rect x="672" y="185" width="148" height="25" rx="4" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="746" y="201" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#22c55e">API Gateway</text>
  <rect x="672" y="225" width="148" height="25" rx="4" fill="#374151" stroke="#6b7280" stroke-width="1"/>
  <text x="746" y="241" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#9ca3af">Service Mesh (mTLS)</text>
  <text x="745" y="295" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">Each owns its DB</text>

  <!-- Bottom key -->
  <rect x="30" y="322" width="800" height="28" rx="6" fill="#1e2533" stroke="#374151" stroke-width="1"/>
  <text x="430" y="340" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6b7280">Key: Identify bounded context → Build new service → Proxy via API Gateway → Deprecate monolith module → Repeat</text>
</svg>
