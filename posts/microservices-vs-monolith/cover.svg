<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#100d1a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="480" fill="url(#bg)"/>
  <g stroke="#1e2533" stroke-width="1" opacity="0.25">
    <line x1="0" y1="96" x2="900" y2="96"/><line x1="0" y1="192" x2="900" y2="192"/>
    <line x1="0" y1="288" x2="900" y2="288"/><line x1="0" y1="384" x2="900" y2="384"/>
    <line x1="90" y1="0" x2="90" y2="480"/><line x1="270" y1="0" x2="270" y2="480"/>
    <line x1="450" y1="0" x2="450" y2="480"/><line x1="630" y1="0" x2="630" y2="480"/>
    <line x1="810" y1="0" x2="810" y2="480"/>
  </g>

  <text x="450" y="50" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#f1f5f9" filter="url(#glow)">Microservices vs. Monolith</text>
  <text x="450" y="74" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#6b7280">Architecture tradeoffs at scale</text>

  <!-- MONOLITH side -->
  <text x="185" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#3b82f6">MONOLITH</text>
  <!-- Big single box -->
  <rect x="50" y="120" width="270" height="220" rx="12" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="2"/>
  <!-- Internal modules -->
  <rect x="70" y="140" width="110" height="40" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="125" y="164" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#3b82f6">API Handlers</text>
  <rect x="190" y="140" width="110" height="40" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="245" y="164" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#3b82f6">Business Logic</text>
  <rect x="70" y="195" width="110" height="40" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="125" y="219" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#3b82f6">Data Access</text>
  <rect x="190" y="195" width="110" height="40" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="245" y="219" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#3b82f6">Auth / Session</text>
  <!-- Single DB -->
  <rect x="100" y="255" width="170" height="36" rx="6" fill="#1e2533" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="185" y="277" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#3b82f6">Single RDBMS</text>
  <!-- One deploy -->
  <rect x="100" y="305" width="170" height="24" rx="4" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1"/>
  <text x="185" y="321" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#3b82f6">1 deployable artifact</text>

  <!-- Monolith pros/cons -->
  <rect x="50" y="360" width="270" height="80" rx="8" fill="#1e2533" stroke="#374151" stroke-width="1"/>
  <text x="75" y="378" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">✓ Simple local dev</text>
  <text x="75" y="393" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">✓ Easy ACID transactions</text>
  <text x="75" y="408" font-family="'Courier New', monospace" font-size="10" fill="#e11d48">✗ Scale entire app together</text>
  <text x="75" y="423" font-family="'Courier New', monospace" font-size="10" fill="#e11d48">✗ Long release cycles at scale</text>

  <!-- VS divider -->
  <circle cx="450" cy="250" r="28" fill="#1e2533" stroke="#374151" stroke-width="2"/>
  <text x="450" y="256" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#f59e0b">VS</text>

  <!-- MICROSERVICES side -->
  <text x="715" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#a855f7">MICROSERVICES</text>
  <!-- Service boxes -->
  <rect x="580" y="125" width="95" height="38" rx="6" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.5"/>
  <text x="627" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">User Service</text>
  <rect x="627" y="146" width="38" height="14" rx="3" fill="#1e2533" stroke="#a855f7" stroke-width="1"/>
  <text x="646" y="157" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#6b7280">DB</text>

  <rect x="690" y="125" width="95" height="38" rx="6" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.5"/>
  <text x="737" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">Order Service</text>
  <rect x="737" y="146" width="38" height="14" rx="3" fill="#1e2533" stroke="#a855f7" stroke-width="1"/>
  <text x="756" y="157" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#6b7280">DB</text>

  <rect x="800" y="125" width="80" height="38" rx="6" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.5"/>
  <text x="840" y="140" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">Notify Svc</text>
  <rect x="820" y="146" width="38" height="14" rx="3" fill="#1e2533" stroke="#a855f7" stroke-width="1"/>
  <text x="839" y="157" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#6b7280">DB</text>

  <rect x="580" y="200" width="95" height="38" rx="6" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.5"/>
  <text x="627" y="215" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">Payment Svc</text>
  <rect x="627" y="221" width="38" height="14" rx="3" fill="#1e2533" stroke="#a855f7" stroke-width="1"/>
  <text x="646" y="232" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#6b7280">DB</text>

  <rect x="690" y="200" width="95" height="38" rx="6" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.5"/>
  <text x="737" y="215" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">Inventory Svc</text>
  <rect x="737" y="221" width="38" height="14" rx="3" fill="#1e2533" stroke="#a855f7" stroke-width="1"/>
  <text x="756" y="232" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#6b7280">DB</text>

  <rect x="800" y="200" width="80" height="38" rx="6" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.5"/>
  <text x="840" y="215" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#a855f7">Search Svc</text>
  <rect x="820" y="221" width="38" height="14" rx="3" fill="#1e2533" stroke="#a855f7" stroke-width="1"/>
  <text x="839" y="232" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#6b7280">DB</text>

  <!-- API Gateway -->
  <rect x="650" y="270" width="160" height="30" rx="6" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1.5"/>
  <text x="730" y="290" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">API Gateway / Service Mesh</text>

  <!-- Microservices pros/cons -->
  <rect x="580" y="320" width="300" height="120" rx="8" fill="#1e2533" stroke="#374151" stroke-width="1"/>
  <text x="600" y="338" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">✓ Independent scaling per service</text>
  <text x="600" y="353" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">✓ Team autonomy at org scale</text>
  <text x="600" y="368" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">✓ Independent deployments</text>
  <text x="600" y="383" font-family="'Courier New', monospace" font-size="10" fill="#e11d48">✗ Distributed tracing complexity</text>
  <text x="600" y="398" font-family="'Courier New', monospace" font-size="10" fill="#e11d48">✗ Sagas for cross-service txns</text>
  <text x="600" y="413" font-family="'Courier New', monospace" font-size="10" fill="#e11d48">✗ N pipelines, N containers</text>
  <text x="600" y="428" font-family="'Courier New', monospace" font-size="10" fill="#e11d48">✗ Wrong for small teams</text>
</svg>
